openapi: 3.1.0
info:
  title: Sandbox Platform
  version: 0.1.0
  description: Management, execution and access API for a single-node Sandbox installation.
servers:
- url: /v1
security:
- bearer: []
- session: []
paths:
  /control:
    get:
      operationId: get_control
      summary: Read the control epoch, runtime readiness, and capabilities
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  control_epoch: {type: string}
                  maintenance: {type: boolean}
                  runtime_version: {type: string}
                  build: {type: string}
                  runtime_ready: {type: boolean}
                  csrf_token: {type: string}
                  capabilities: {type: object, additionalProperties: true}
                required:
                - control_epoch
        default: {$ref: '#/components/responses/Error'}
  /runtime-profiles:
    get:
      operationId: list_runtime_profiles
      summary: List the registered deep runtime instances and pinned bundles
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Registered runtime profiles and persisted reference counts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RuntimeProfile'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: post_auth_login
      summary: Authenticate the owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, minLength: 1}
                password: {type: string, format: password}
              required:
              - username
              - password
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: post_auth_logout
      summary: Revoke the current browser session
      parameters:
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /tokens:
    get:
      operationId: get_tokens
      summary: List API tokens
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: post_tokens
      summary: Issue an API token
      description: The token secret is returned on initial issue.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, minLength: 1}
                scope: {$ref: '#/components/schemas/TokenScope'}
                expires_at: {type: string, format: date-time}
              required:
              - label
              - scope
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
        default: {$ref: '#/components/responses/Error'}
  /tokens/{token}:
    delete:
      operationId: delete_tokens_token
      summary: Revoke an API token
      parameters:
      - name: token
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_id: {type: string, minLength: 1}
                  status: {type: string, enum: [revoked]}
                  revision: {type: integer, minimum: 1}
                required:
                - token_id
                - status
                - revision
                additionalProperties: false
        default: {$ref: '#/components/responses/Error'}
  /ssh-keys:
    get:
      operationId: get_ssh_keys
      summary: List Guest public keys
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSHKeyPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: post_ssh_keys
      summary: Register a Guest SSH public key
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key: {type: string, minLength: 1}
                label: {type: string}
              required:
              - public_key
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /ssh-keys/{key}:
    delete:
      operationId: delete_ssh_keys_key
      summary: Revoke a Guest SSH key
      parameters:
      - name: key
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /client-certificates:
    get:
      operationId: get_client_certificates
      summary: List issued client certificates
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: post_client_certificates
      summary: Issue a client mTLS certificate from a CSR
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csr: {type: string, minLength: 1}
                scope:
                  type: object
                  properties:
                    service_ids: {type: array, items: {type: string, minLength: 1}}
                  required:
                  - service_ids
                  additionalProperties: false
                ttl_seconds: {type: integer, minimum: 1}
              required:
              - csr
              - scope
              - ttl_seconds
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /client-certificates/{certificate}:
    delete:
      operationId: delete_client_certificates_certificate
      summary: Revoke a client mTLS certificate
      parameters:
      - name: certificate
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /machines:
    get:
      operationId: get_machines
      summary: List visible machines
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MachinePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: post_machines
      summary: Create a machine
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMachine'}
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}:
    get:
      operationId: get_machines_machine
      summary: Read a machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Machine'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: patch_machines_machine
      summary: Update machine configuration
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MachinePatch'}
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_machines_machine
      summary: Delete the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/start:
    post:
      operationId: post_machines_machine_start
      summary: Start the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
                reason: {type: string}
                allow_active_tasks: {type: boolean}
                cancel_tasks: {type: boolean}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/stop:
    post:
      operationId: post_machines_machine_stop
      summary: Stop the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
                reason: {type: string}
                allow_active_tasks: {type: boolean}
                cancel_tasks: {type: boolean}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/pause:
    post:
      operationId: post_machines_machine_pause
      summary: Pause the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
                reason: {type: string}
                allow_active_tasks: {type: boolean}
                cancel_tasks: {type: boolean}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/resume:
    post:
      operationId: post_machines_machine_resume
      summary: Resume the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
                reason: {type: string}
                allow_active_tasks: {type: boolean}
                cancel_tasks: {type: boolean}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/wake:
    post:
      operationId: post_machines_machine_wake
      summary: Wake the machine
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_generation: {type: integer, minimum: 1}
                reason: {type: string}
                allow_active_tasks: {type: boolean}
                cancel_tasks: {type: boolean}
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/dependencies:
    get:
      operationId: get_machines_machine_dependencies
      summary: Get logical lineage and native resource dependencies
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/standby:
    post:
      operationId: standby_machine
      summary: Hold a running VM in standby
      parameters: &full_state_parameters
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody: &full_state_request
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FullStateAction'}
      responses: &full_state_responses
        '202':
          description: Durably accepted on a verified runtime
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/hibernate:
    post:
      operationId: hibernate_machine
      summary: Save a durable VM checkpoint and end the active execution
      parameters: *full_state_parameters
      requestBody: *full_state_request
      responses: *full_state_responses
  /machines/{machine}/fork-batches:
    post:
      operationId: fork_batch
      summary: Create children from one verified source capture
      parameters: *full_state_parameters
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForkBatchRequest'}
      responses: *full_state_responses
  /machines/{machine}/forks:
    post:
      operationId: post_machines_machine_forks
      summary: Create a Live Fork
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                child_name: {type: string, minLength: 1}
                expected_generation: {type: integer, minimum: 1}
                require_independent: {type: boolean, default: false}
              required:
              - child_name
              if:
                required: [require_independent]
                properties:
                  require_independent: {const: true}
              then:
                required: [expected_generation]
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /machines/{machine}/clones:
    post:
      operationId: post_machines_machine_clones
      summary: Create an independent clone
      parameters:
      - name: machine
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                child_name: {type: string, minLength: 1}
                expected_generation: {type: integer, minimum: 1}
                copy_policy: {type: string, enum: [managed_clean]}
              required:
              - child_name
              additionalProperties: false
      responses:
        '202':
          description: Durably accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              description: Path of the accepted operation
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /volumes:
    get:
      operationId: listVolumes
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Registered volumes owned by the principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VolumePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createVolume
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capacity_bytes, runtime_instance_id]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                capacity_bytes: {type: integer, format: int64, minimum: 512, multipleOf: 512}
                runtime_instance_id: {type: string}
                lifecycle: {type: string, enum: [persistent, ephemeral], default: persistent}
      responses:
        '202': {$ref: '#/components/responses/VolumeOperationAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /volumes/{volume}:
    parameters:
    - {name: volume, in: path, required: true, schema: {type: string}}
    get:
      operationId: getVolume
      responses:
        '200':
          description: Current Worker full volume observation
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Volume'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: growVolume
      description: Increase the block capacity of a volume with no live or unconfirmed writer. The receipt reports guest filesystem resize separately.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacity_bytes]
              properties:
                capacity_bytes: {type: integer, format: int64, minimum: 512, multipleOf: 512}
      responses:
        '202': {$ref: '#/components/responses/VolumeOperationAccepted'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteVolume
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '202': {$ref: '#/components/responses/VolumeOperationAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /volumes/{volume}/snapshots:
    parameters:
    - {name: volume, in: path, required: true, schema: {type: string}}
    get:
      operationId: listVolumeSnapshots
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Pinned immutable disk generations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/VolumeSnapshot'}}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createVolumeSnapshot
      description: Capture the volume generation with no live or unconfirmed writer.
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/Revision'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '202': {$ref: '#/components/responses/VolumeOperationAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /volume-snapshots/{snapshot}:
    parameters:
    - {name: snapshot, in: path, required: true, schema: {type: string}}
    get:
      operationId: getVolumeSnapshot
      responses:
        '200':
