          description: Retry accepted for the original durable fork operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /operations/{operation}/reconcile:
    post:
      operationId: post_operations_operation_reconcile
      summary: Reconcile a durable operation
      parameters:
      - name: operation
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /operations/{operation}/cancel:
    post:
      operationId: post_operations_operation_cancel
      summary: Cancel a durable operation
      parameters:
      - name: operation
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
  /backups:
    get:
      operationId: list_backup_runs
      summary: List scheduled or manually requested backup runs
      parameters:
      - {name: policy_id, in: query, schema: {type: string}}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Backup history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BackupRun'}}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /backups/{backup}:
    get:
      operationId: get_backup_run
      summary: Inspect a backup run
      parameters:
      - {name: backup, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Backup run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupRun'}
        default: {$ref: '#/components/responses/Error'}
  /backups/policies:
    get:
      operationId: list_backup_policies
      summary: List operator-configured backup schedules
      parameters:
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Backup policy summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BackupPolicy'}}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /backups/policies/{policy}/runs:
    post:
      operationId: run_backup_policy
      summary: Request a backup under an existing policy
      parameters:
      - {name: policy, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/ControlEpoch'}
      - {$ref: '#/components/parameters/CSRF'}
      responses:
        '202':
          description: Backup accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupRun'}
        default: {$ref: '#/components/responses/Error'}
  /events:
    get:
      operationId: get_events
      summary: Replay and follow durable events
      description: Send the last processed event ID when reconnecting. HTTP 410 requires fetching current state before resubscribing. JSON data includes event_name, resource_kind, resource_id, schema_version and the scoped payload.
      parameters:
      - name: Last-Event-ID
        in: header
        schema: {type: string}
      responses:
        '200':
          description: Successful response
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      description: HTTPS management session. The loopback HTTP installation uses the host-only sandbox-loopback-session cookie scoped to /v1.
      name: __Host-sandbox-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    ControlEpoch:
      name: If-Control-Epoch
      in: header
      required: true
      schema: {type: string}
    Revision:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    CSRF:
      name: X-CSRF-Token
      in: header
      required: false
      schema: {type: string}
      description: Required for authenticated browser session writes.
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
  responses:
    PrivatePacketWakeRule:
      description: Current peer authorization and the last reconciled wake
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PrivatePacketWakeRule'}
    VolumeOperationAccepted:
      description: Accepted operation. Follow its result for the Worker receipt.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Operation'}
    Error:
      description: Request failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    BackupScope:
      type: string
      enum: [platform_snapshots, durable_runtime]
    BackupPolicy:
      type: object
      required: [policy_id, scope, interval_seconds, retain]
      properties:
        policy_id: {type: string}
        scope: {$ref: '#/components/schemas/BackupScope'}
        interval_seconds: {type: integer, minimum: 1}
        retain: {type: integer, minimum: 1}
    BackupRun:
      type: object
      required: [backup_id, policy_id, scope, control_epoch, state, started_at]
      properties:
        backup_id: {type: string}
        policy_id: {type: string}
        scope: {$ref: '#/components/schemas/BackupScope'}
        control_epoch: {type: string}
        state: {type: string, enum: [running, verified, failed, retiring, retired]}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        failure_code: {type: string}
    PrivatePacketWakeRule:
      type: object
      required: [rule_id, source_attachment_id, target_attachment_id, transport, guest_port, enabled, revision, source_current]
      properties:
        rule_id: {type: string}
        source_attachment_id: {type: string}
        target_attachment_id: {type: string}
        transport: {type: string, enum: [tcp, udp]}
        guest_port: {type: integer, minimum: 1, maximum: 65535}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 1}
        source_current: {type: boolean}
        source_incarnation_id: {type: [string, 'null']}
        source_execution_epoch: {type: [integer, 'null']}
        last_wake:
          type: [object, 'null']
          required: [operation_id, rule_revision, execution_epoch, authorized]
          properties:
            operation_id: {type: string}
            rule_revision: {type: integer}
            execution_epoch: {type: integer}
            authorized: {type: boolean}
            datagram:
              type: [string, 'null']
              enum: [forwarded, dropped, unknown, null]
              description: Durable UDP wake can retain a single datagram up to 1200 bytes for at most 15 seconds. This reports its forwarding outcome.
    VolumeRestorePolicy:
      type: string
      enum: [exact, clone_conflicts]
      description: For VM snapshots. Exact requires authorization for every captured volume generation. Clone conflicts creates independent writable volume IDs and returns the volume map.
    VolumePage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Volume'}}
        next_cursor: {type: string}
    Volume:
      type: object
      required: [volume_id, name, owner_id, runtime_instance_id, runtime_bundle_id, revision, lifecycle, state]
      properties:
        volume_id: {type: string}
        name: {type: string}
        owner_id: {type: string}
        runtime_instance_id: {type: string}
        runtime_bundle_id: {type: string}
        revision: {type: integer, format: int64}
        lifecycle: {type: string, enum: [persistent, ephemeral]}
        state: {type: string, enum: [available, changing, deleted]}
        capacity_bytes: {type: integer, format: int64}
        head_resource_id: {type: string}
        generation_id: {type: string}
        snapshots: {type: array, items: {$ref: '#/components/schemas/VolumeSnapshot'}}
        attachments: {type: array, items: {$ref: '#/components/schemas/VolumeAttachment'}}
    VolumeSnapshot:
      type: object
      required: [snapshot_id, generation_id, source_revision, capacity_bytes]
      properties:
        snapshot_id: {type: string}
        volume_id: {type: string}
        volume_revision: {type: integer, format: int64}
        generation_id: {type: string}
        source_revision: {type: integer, format: int64}
        capacity_bytes: {type: integer, format: int64}
    VolumeAttachment:
      type: object
      required: [attachment_id, device_key, mode, fork_policy, capture_policy, revision, state]
      properties:
        attachment_id: {type: string}
        volume_id: {type: string}
        machine_id: {type: string}
        binding_id: {type: string}
        instance_id: {type: string}
        device_key: {type: string}
        mode: {type: string, enum: [rw, ro]}
        fork_policy: {type: string, enum: [clone, share_immutable, reject]}
        capture_policy: {type: string, enum: [include, external]}
        generation_id: {type: string}
        revision: {type: integer, format: int64}
        state: {type: string, enum: [reserved, attached, unknown]}
    Error:
      type: object
      properties:
        request_id: {type: string, minLength: 1}
        operation_id: {type: string, minLength: 1}
        code: {type: string, minLength: 1}
        capability: {type: string}
        reason_code: {type: string}
        message: {type: string}
        effect: {type: string, enum: [none, applied, partial, unknown]}
        retry: {type: string, enum: [never, same_key, poll_operation, after_precondition, client_decision]}
      required:
      - code
      - message
      - effect
      - retry
    ErrorEnvelope:
      type: object
      properties:
        error: {$ref: '#/components/schemas/Error'}
      required:
      - error
      additionalProperties: false
    RuntimeProfile:
      type: object
      required: [runtime_instance_id, runtime_bundle_id, state_reader_id, status, verification_status, security_status, boot_profiles, running_bindings, standby_bindings, hibernated_bindings, bundle_binding_refs, bundle_snapshot_refs, capabilities]
      properties:
        runtime_instance_id: {type: string}
        runtime_bundle_id: {type: string}
        state_reader_id: {type: string}
        status: {type: string}
        verification_status: {type: string}
        security_status: {type: string}
        boot_profiles:
          type: array
          items: {type: string}
        running_bindings: {type: integer, minimum: 0}
        standby_bindings: {type: integer, minimum: 0}
        hibernated_bindings: {type: integer, minimum: 0}
        bundle_binding_refs: {type: integer, minimum: 0}
        bundle_snapshot_refs: {type: integer, minimum: 0}
        capabilities:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Capability'}
    FullStateAction:
      type: object
      required: [expected_generation]
      additionalProperties: false
      properties:
        expected_generation: {type: integer, minimum: 1}
        activity_policy:
          type: object
          additionalProperties: false
          properties:
            allow_active_tasks: {type: boolean}
    ForkBatchRequest:
      type: object
      required: [expected_generation, children]
      additionalProperties: false
      properties:
        expected_generation: {type: integer, minimum: 1}
        require_independent: {type: boolean}
        children:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 255}
        volume_policy:
          type: object
          additionalProperties: false
          properties:
            default: {const: clone}
    OperationChild:
      type: object
      required: [ordinal, machine_id, binding_id, state, attempt]
      properties:
        ordinal: {type: integer, minimum: 0}
        attempt: {type: integer, minimum: 0}
        machine_id: {type: string}
        binding_id: {type: string}
        state: {type: string}
        resource_independence: {type: string, enum: [unknown, verified, failed]}
        error_code: {type: string}
    Operation:
      type: object
      properties:
        operation_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
        machine_id: {type: string, minLength: 1}
        kind: {type: string}
        stage: {type: string}
        state: {type: string, enum: [queued, dispatching, observing, succeeded, failed, cancelled, recovery_required]}
        effect: {type: string, enum: [none, applied, partial, unknown]}
        binding_generation: {type: integer, minimum: 1}
        source_disposition: {type: string, enum: [RUNNING, STANDBY, HELD, EXITED, UNKNOWN]}
        source_lock_released: {type: boolean, description: The source resumed its recorded disposition and can accept new mutations while fork children finish.}
        children:
          type: array
          items: {$ref: '#/components/schemas/OperationChild'}
        error: {anyOf: [{$ref: '#/components/schemas/Error'}, {type: 'null'}]}
        result: {type: [object, 'null']}
      required:
      - operation_id
      - revision
      - state
      - kind
      - stage
      - effect
    Capability:
      type: object
      properties:
        status: {type: string, enum: [supported, unsupported, unknown]}
        contract_version: {type: integer}
        constraints: {type: object, additionalProperties: true}
        supported: {type: boolean}
        reason_code: {type: [string, 'null']}
        message: {type: string}
        verified_profile: {type: string}
      required:
      - supported
    Resources:
      type: object
      properties:
        cpu_count: {type: integer, minimum: 1}
        memory_mib: {type: integer, minimum: 1}
        storage_gib: {type: integer, minimum: 1}
        overlay_gib: {type: integer, minimum: 1}
      additionalProperties: false
    ResourcePatch:
      type: object
      properties:
        cpu_count: {type: integer, minimum: 1, maximum: 255}
        memory_mib: {type: integer, minimum: 1}
        storage_gib: {type: integer, minimum: 1}
        overlay_gib: {type: integer, minimum: 1}
        balloon_target_mib: {type: integer, minimum: 0, description: "Amount to reclaim through the Guest balloon. Zero deflates the balloon."}
        cpu_limit_millicpus: {type: [integer, "null"], minimum: 1, description: "CPU bandwidth in millicpus. Set null to restore the allocated vCPU ceiling."}
      additionalProperties: false
    MachineResourceStatus:
      type: object
      required: [machine_id, binding_generation, power_state, requested, issues]
      properties:
        machine_id: {type: string}
        binding_generation: {type: integer}
        power_state: {type: string}
        requested: {$ref: '#/components/schemas/ResourcePatch'}
        execution:
          type: object
          required: [instance_id, incarnation_id, execution_epoch]
          properties:
            instance_id: {type: string}
            incarnation_id: {type: string}
            execution_epoch: {type: integer, minimum: 1}
        compute:
          type: object
          required: [profile, capture_compatible, capabilities, observed]
          properties:
            profile: {type: string}
            capture_compatible: {type: boolean}
            capabilities:
              type: object
              additionalProperties:
                type: object
                required: [supported, available_now, reason]
                properties:
                  supported: {type: boolean}
                  available_now: {type: boolean}
                  reason: {type: [string, "null"]}
            observed: {type: object, additionalProperties: true}
            pending: {type: [object, "null"]}
        cpu_limit:
          type: object
          required: [requested_millicpus, quota_usec, period_usec]
          properties:
            requested_millicpus: {type: [integer, "null"]}
            quota_usec: {type: [integer, "null"]}
            period_usec: {type: integer}
        issues:
          type: object
          additionalProperties:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
    LifecyclePolicy:
      type: object
      additionalProperties: false
      properties:
        schema_version: {const: 1}
        auto_standby: {type: boolean}
        standby_after_seconds: {type: integer, minimum: 0, maximum: 31536000}
        auto_hibernate: {type: boolean}
        hibernate_after_seconds: {type: integer, minimum: 0, maximum: 31536000}
        keep_running: {type: boolean}
        reclaim_priority: {type: integer, minimum: 0, maximum: 100}
        pressure_reclaim: {type: string, enum: [disabled, idle_only]}
        min_running_after_wake_seconds: {type: integer, minimum: 0, maximum: 31536000}
        retry_backoff_seconds: {type: integer, minimum: 1, maximum: 31536000}
        wake_conditions:
          type: object
          additionalProperties: false
          properties:
            api_access: {type: boolean}
            service_access: {type: boolean}
            private_network_packet: {type: boolean}
            allow_cold_start: {type: boolean}
        activity:
          type: object
          additionalProperties: false
          properties:
            protect_running_tasks: {type: boolean}
            protect_exec_sessions: {type: boolean}
            protect_inbound_connections: {type: boolean}
            protect_outbound_connections: {type: boolean}
            protect_running_leases: {const: true}
            unknown: {const: block_auto_sleep}
    LifecycleStatus:
      type: object
      required: [supported, desired_revision, applied_revision, desired, overrides, source, default_revision]
      properties:
        supported: {type: boolean}
        desired_revision: {type: integer}
        applied_revision: {type: integer}
        default_revision: {type: integer}
        source: {type: string}
        desired: {$ref: '#/components/schemas/LifecyclePolicy'}
        applied: {$ref: '#/components/schemas/LifecyclePolicy'}
        overrides: {$ref: '#/components/schemas/LifecyclePolicy'}
        operation_id: {type: string}
        worker: {type: object, additionalProperties: true}
        last_error: {type: string}
    PolicyApplication:
      type: object
      required: [application_id, default_policy_revision, complete, policy, machines]
      properties:
        application_id: {type: string}
        default_policy_revision: {type: integer}
        complete: {type: boolean}
        policy: {$ref: '#/components/schemas/LifecyclePolicy'}
        machines:
          type: array
          items:
            type: object
            required: [machine_id, expected_revision, state]
            properties:
              machine_id: {type: string}
              expected_revision: {type: integer}
              policy_revision: {type: integer}
              state: {enum: [pending, applied, rejected]}
              reason: {type: string}
    IdlePolicy:
      type: object
      properties:
        enabled: {type: boolean}
        timeout_seconds: {type: integer, minimum: 1}
      additionalProperties: false
    CreateMachine:
      type: object
      properties:
        lifecycle_policy: {$ref: '#/components/schemas/LifecyclePolicy'}
        name: {type: string, minLength: 1}
        template_id: {type: string, minLength: 1}
        boot_mode: {$ref: '#/components/schemas/BootMode'}
        live_compute_growth: {type: boolean, default: false, description: "Opt in to live CPU and RAM growth on a compatible System runtime. This profile disables full VM state capture."}
        network: {$ref: '#/components/schemas/MachineNetwork'}
        runtime_instance_id: {type: string, minLength: 1, description: Operator-registered Serve instance. System templates require a verified System runtime.}
        resources: {$ref: '#/components/schemas/Resources'}
        idle_policy: {$ref: '#/components/schemas/IdlePolicy'}
        start: {type: boolean, description: Start after creation. Leave false to attach volumes to a stopped System machine before first boot.}
      required:
      - name
      - template_id
      additionalProperties: false
    BootMode:
      type: string
      enum: [oci, system]
    MachineNetwork:
      description: Private network selection for a System template using a registered Worker runtime.
      type: object
      properties:
        network_id: {type: string}
        mode: {type: string, enum: [native, fixed_internal], default: native}
      additionalProperties: false
    MachinePatch:
      type: object
      properties:
        expected_policy_revision: {type: integer, minimum: 1}
        lifecycle_policy: {$ref: '#/components/schemas/LifecyclePolicy'}
        name: {type: string, minLength: 1}
        resources: {$ref: '#/components/schemas/ResourcePatch'}
        idle_policy: {$ref: '#/components/schemas/IdlePolicy'}
        keep_running: {type: boolean}
        expected_generation: {type: integer, minimum: 1}
      additionalProperties: false
    Machine:
      type: object
      properties:
        lifecycle_policy: {$ref: '#/components/schemas/LifecycleStatus'}
        machine_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        template_id: {type: string, minLength: 1}
        boot_mode: {$ref: '#/components/schemas/BootMode'}
        live_compute_growth: {type: boolean}
        desktop_profile: {const: software-vnc-v1}
        network: {$ref: '#/components/schemas/MachineNetwork'}
        resources: {$ref: '#/components/schemas/ResourcePatch'}
        idle_policy: {$ref: '#/components/schemas/IdlePolicy'}
        keep_running: {type: boolean}
        revision: {type: integer, minimum: 1}
        binding_generation: {type: integer, minimum: 1}
        power_state: {type: string, enum: [running, standby, hibernated, stopped, unknown]}
        health:
          type: object
          properties:
            vm: {type: string}
            guest_management: {type: string}
            workload: {type: string}
            workload_error: {type: object, properties: {code: {type: string}, message: {type: string}}}
            network_identity: {type: string}
            services: {type: string}
        observed_state: {type: string}
        availability: {type: string}
        desired_power: {type: string}
        operation_id: {type: string, minLength: 1}
        observed_at: {type: string, format: date-time}
        last_user_activity_at: {type: string, format: date-time}
        blocked_reasons: {type: array, items: {type: string}}
        runtime_identity: {type: object, additionalProperties: true}
        runtime_name: {type: string}
        capabilities: {type: object, additionalProperties: {$ref: '#/components/schemas/Capability'}}
        binding:
          type: object
          properties:
            binding_id: {type: string, minLength: 1}
            runtime_instance_id: {type: string, minLength: 1}
            runtime_bundle_id: {type: string, minLength: 1}
            runtime_identity: {type: object, additionalProperties: true}
            state_reason: {type: object, additionalProperties: true}
            guest_management_evidence: {type: object, additionalProperties: true}
      required:
      - machine_id
      - name
      - template_id
      - revision
      - binding_generation
      - observed_state
      - availability
    Task:
      type: object
      properties:
        id: {type: string, minLength: 1}
        task_id: {type: string, minLength: 1}
        machine_id: {type: string, minLength: 1}
        binding_generation: {type: integer, minimum: 1}
        state: {type: string, enum: [accepted, starting, running, cancelling, succeeded, failed, cancelled, unknown, interrupted]}
        observed_at: {type: string, format: date-time}
        exit_code: {type: [integer, 'null']}
        origin_machine_id: {type: string, minLength: 1}
        origin_task_id: {type: string, minLength: 1}
      required:
      - machine_id
      - state
    TaskOutput:
      type: object
      properties:
        data_base64: {type: [string, 'null'], contentEncoding: base64}
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
        next: {type: integer, minimum: 0}
        gap: {type: boolean}
        complete: {type: boolean}
        dropped: {type: integer, minimum: 0}
      required:
      - data_base64
      - start
      - next
      - gap
      - complete
      additionalProperties: false
    Snapshot:
      type: object
      properties:
        snapshot_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
        source_machine_id: {type: string, minLength: 1}
        capture_mode: {type: string, enum: [managed_tasks, vm]}
        vm_provenance:
          type: object
          required: [operation_id, runtime_instance_id, runtime_bundle_id, state_reader_id, runtime_capture_id]
          properties:
            operation_id: {type: string}
            runtime_instance_id: {type: string}
            runtime_bundle_id: {type: string}
